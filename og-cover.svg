  </defs>
  <!-- energy flow (faint) -->
  <g stroke="#0d1526" stroke-opacity="0.10" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(80 430) scale(1.15)">
    <g><circle cx="40" cy="40" r="20"/><path d="M40 6V16 M40 64v10 M2 40h10 M68 40h10 M14 14l7 7 M59 59l7 7 M66 14l-7 7 M21 59l-7 7"/></g>
    <g transform="translate(150 0)"><path d="M0 34h58v24H0z"/><path d="M19 34v24 M38 34v24 M0 46h58"/></g>
