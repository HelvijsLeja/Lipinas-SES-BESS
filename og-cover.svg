  <text x="80" y="320" font-family="'Inter','DejaVu Sans',sans-serif" font-size="34" font-weight="500" fill="#47566c">3 MW saules enerģijas sistēma + 5 MWh bateriju uzkrāšana</text>
  <text x="80" y="366" font-family="'Inter','DejaVu Sans',sans-serif" font-size="28" font-weight="500" fill="#748196">Salaspils novads, Latvija · Investīciju iespēja</text>
